<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>store render</title>
<style>
  @font-face {
    font-family: "Newsreader";
    src: url("assets/fonts/Newsreader-VF.ttf") format("truetype-variations");
    font-weight: 200 700; font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px; height: 1024px; overflow: hidden;
    background: #FAFDF5; color: #083620;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 76px;
  }

  .mark-row { display: flex; align-items: center; gap: 20px; }
  .mark-row svg { width: 74px; height: 64px; color: #00BF63; }
  .mark-row b {
    font-family: "Newsreader", Georgia, serif;
    font-size: 92px; font-weight: 620; letter-spacing: -0.02em; line-height: 1;
  }

  h1 {
    font-family: "Newsreader", Georgia, serif;
    font-size: 44px; font-weight: 560; line-height: 1.25;
    letter-spacing: -0.01em; text-align: center; margin-top: 22px;
  }
  h1 .hl { background: #C1FF72; border-radius: 7px; padding: 0 9px; }

  /* Slate's own live-text surface: what the app looks like in use. */
  .island {
    margin-top: 62px; width: 100%;
    background: #F4FDEC; border: 2px solid rgba(0,191,99,.42);
    border-radius: 28px; padding: 34px 38px 38px;
    box-shadow: 0 20px 46px rgba(8,54,32,.09);
  }
  .island .wave { display: flex; gap: 10px; margin-bottom: 22px; }
  .island .wave i { width: 12px; height: 12px; border-radius: 50%; background: #00BF63; }
  .island .said {
    font-size: 25px; color: #3A6250; margin-bottom: 14px; letter-spacing: -0.01em;
  }
  .island p {
    font-family: "Newsreader", Georgia, serif;
    font-size: 46px; line-height: 1.25; letter-spacing: -0.01em;
  }
  .island .rev { background: #C1FF72; border-radius: 6px; padding: 0 7px; }

  .seats {
    margin-top: 58px;
    display: flex; align-items: center; gap: 16px;
    background: #fff; border: 2px solid rgba(0,191,99,.38);
    border-radius: 999px; padding: 18px 40px;
    font-size: 34px; letter-spacing: -0.01em;
  }
  .seats .dots { display: flex; gap: 9px; }
  .seats .dots i { width: 17px; height: 17px; border-radius: 5px; background: #00BF63; }
  .seats .dots i.off { background: rgba(0,191,99,.20); }

  .foot { margin-top: 34px; font-size: 27px; color: #3A6250; }
</style>
</head>
<body>

  <div class="mark-row">
    <svg viewBox="0 0 28 24" aria-hidden="true"><g fill="currentColor">
      <rect x="0" y="8.5" width="2.6" height="7" rx="1.3"/>
      <rect x="4.2" y="6.5" width="2.6" height="11" rx="1.3"/>
      <rect x="8.4" y="4" width="2.6" height="16" rx="1.3"/>
      <rect x="12.6" y="1" width="2.6" height="22" rx="1.3"/>
      <rect x="16.8" y="4.5" width="2.6" height="15" rx="1.3"/>
      <rect x="21" y="6.5" width="2.6" height="11" rx="1.3"/>
      <rect x="25.2" y="8.5" width="2.6" height="7" rx="1.3"/>
    </g></svg>
    <b>Slate</b>
  </div>

  <h1>Dictation that <span class="hl">never leaves your Mac</span>.</h1>

  <div class="island">
    <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="said">You said: “meet me at 5pm, no, 5:15pm”</div>
    <p>Meet me at <span class="rev">5:15pm</span>.</p>
  </div>

  <div class="seats" id="seats"></div>
  <p class="foot">Pay once. No subscription. No account.</p>

<script>
  const n = Number(new URLSearchParams(location.search).get('seats') || 1);
  const label = n === 1 ? 'One Mac, yours for good' : n + ' Macs, yours for good';
  let dots = '';
  for (let i = 0; i < 3; i++) dots += '<i class="' + (i < n ? '' : 'off') + '"></i>';
  document.getElementById('seats').innerHTML =
    '<span class="dots">' + dots + '</span><span>' + label + '</span>';
</script>

</body>
</html>
